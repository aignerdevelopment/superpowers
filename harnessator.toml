# harnessator source manifest - POINTER form (source format v1.1):
# [discover] registers every skills/<dir> containing SKILL.md live at
# load time - nothing is copied here, so this file cannot drift from
# the tree below. Pinned upstream provenance: see UPSTREAM.md; the
# authors' license travels verbatim in LICENSE.
kind = "source"
schema = 2

[package]
  name = "superpowers"
  description = "Jesse Vincent's (obra) superpowers skills - a pinned, byte-identical harnessator harvest of upstream v7.0.1. See README.md; content unmodified."
  version = "7.0.1"
  homepage = "https://github.com/obra/superpowers"
  license = "MIT"

[discover]
  skill = "skills/*"

[profiles]
  [profiles.core]
    skill = ["brainstorming", "systematic-debugging", "test-driven-development", "using-superpowers"]
  [profiles."default"]
    skill = ["*"]
